openapi: 3.1.0
info:
  title: Products API
  version: 1.0.0
  description: |
    Catálogo de productos por mercado. Dueño: equipo de products-api.

    Reglas para consumidores:
    - Ignorar campos desconocidos en las respuestas.
    - Tratar valores desconocidos de `status` o `taxCategory` con un valor seguro
      (para order-processor: producto no elegible).
    - Decidir por código HTTP y `code` del error, nunca por `message`.
    - Reintentables: 429, 500, 502, 503 y timeout. Definitivos: 400, 404.
servers:
  - url: http://localhost:8081
paths:
  /products/{productId}:
    get:
      operationId: getProduct
      summary: Obtiene un producto en un mercado
      parameters:
        - $ref: '#/components/parameters/ProductId'
        - $ref: '#/components/parameters/Market'
        - $ref: '#/components/parameters/Traceparent'
        - $ref: '#/components/parameters/Fault'
      responses:
        '200':
          description: Producto encontrado en el mercado indicado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Product'
              example:
                productId: PRD-001
                name: Bebida 600 ml
                sku: BEB-600-PET
                status: ACTIVE
                taxCategory: STANDARD
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          description: El producto no existe o no se comercializa en ese mercado.
          content:
            application/json:
              schema:
                $ref: './error.schema.json'
              example:
                code: PRODUCT_NOT_FOUND
                message: Product PRD-999 not found in market PE
                status: 404
                traceId: 4bf92f3577b34da6a3ce929d0e0e4736
                timestamp: '2026-09-18T15:42:10Z'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/ServerError'
        '502':
          $ref: '#/components/responses/ServerError'
        '503':
          $ref: '#/components/responses/ServerError'
  /health:
    get:
      operationId: health
      summary: Healthcheck (liveness y readiness)
      responses:
        '200':
          description: Servicio sano.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
        '503':
          description: Servicio apagándose o no listo.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
components:
  parameters:
    ProductId:
      name: productId
      in: path
      required: true
      schema:
        type: string
        minLength: 1
        maxLength: 64
        pattern: '^[A-Za-z0-9-]+$'
    Market:
      name: market
      in: query
      required: true
      description: 'Mercado ISO 3166-1 alfa-2. Soportados en v1: MX, CO, PE.'
      schema:
        type: string
        enum: [MX, CO, PE]
    Traceparent:
      name: traceparent
      in: header
      required: false
      description: Contexto de trazas W3C. Si falta, el servicio genera un traceId.
      schema:
        type: string
    Fault:
      name: X-Fault
      in: header
      required: false
      description: |
        SOLO PARA PRUEBAS. Se ignora salvo que FAULT_INJECTION_ENABLED=true.
        Fuerza una respuesta de error para simular fallos transitorios.
      schema:
        type: string
        enum: ['429', '500', '502', '503', 'timeout']
  responses:
    BadRequest:
      description: Parámetros inválidos.
      content:
        application/json:
          schema:
            $ref: './error.schema.json'
          example:
            code: INVALID_PARAMETER
            message: market must be one of MX, CO, PE
            status: 400
            timestamp: '2026-09-18T15:42:10Z'
            details:
              - field: market
                issue: unsupported value 'AR'
    TooManyRequests:
      description: Límite temporal de solicitudes. Reintentable.
      headers:
        Retry-After:
          description: Segundos sugeridos antes de reintentar.
          schema:
            type: integer
            minimum: 0
      content:
        application/json:
          schema:
            $ref: './error.schema.json'
          example:
            code: RATE_LIMITED
            message: Too many requests
            status: 429
            timestamp: '2026-09-18T15:42:10Z'
    ServerError:
      description: Error transitorio del servidor o de una dependencia. Reintentable.
      content:
        application/json:
          schema:
            $ref: './error.schema.json'
          example:
            code: SERVICE_UNAVAILABLE
            message: Service temporarily unavailable
            status: 503
            timestamp: '2026-09-18T15:42:10Z'
  schemas:
    Product:
      type: object
      required: [productId, name, sku, status, taxCategory]
      additionalProperties: true
      properties:
        productId:
          type: string
        name:
          type: string
        sku:
          type: string
        status:
          type: string
          enum: [ACTIVE, DISCONTINUED]
        taxCategory:
          type: string
          enum: [STANDARD, REDUCED, EXEMPT]
    Health:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [UP, DOWN]
