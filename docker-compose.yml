name: b2b-orders

services:

  # ---------------------------------------------------------------------------
  # Kafka en modo KRaft (sin ZooKeeper), un solo nodo broker + controller.
  # ---------------------------------------------------------------------------
  kafka:
    image: apache/kafka:${KAFKA_VERSION:-4.0.0}
    hostname: kafka
    ports:
      - "${KAFKA_HOST_PORT:-9092}:9092"
    environment:
      CLUSTER_ID: "MkU3OEVBNTcwNTJENDM2Qk"
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: INTERNAL://:19092,CONTROLLER://:9093,EXTERNAL://:9092
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:19092,EXTERNAL://localhost:${KAFKA_HOST_PORT:-9092}
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server kafka:19092 > /dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 20s

  kafka-init:
    image: apache/kafka:${KAFKA_VERSION:-4.0.0}
    depends_on:
      kafka:
        condition: service_healthy
    environment:
      KAFKA_BOOTSTRAP: kafka:19092
      TOPIC_PARTITIONS: ${TOPIC_PARTITIONS:-3}
    volumes:
      - ./infra/kafka/create-topics.sh:/scripts/create-topics.sh:ro
    entrypoint: ["/bin/sh", "/scripts/create-topics.sh"]
    restart: "no"

  # ---------------------------------------------------------------------------
  # MongoDB como replica set de un nodo (rs0): necesario para las transacciones
  # ---------------------------------------------------------------------------
  mongo:
    image: mongo:${MONGO_VERSION:-8.0}
    hostname: mongo
    command: ["mongod", "--replSet", "rs0", "--bind_ip_all", "--port", "27017"]
    ports:
      - "${MONGO_HOST_PORT:-27017}:27017"
    healthcheck:
      test:
        - CMD
        - mongosh
        - --quiet
        - --eval
        - "try { rs.status() } catch (e) { rs.initiate({ _id: 'rs0', members: [{ _id: 0, host: 'mongo:27017' }] }) }; if (!db.hello().isWritablePrimary) { quit(1) }"
      interval: 5s
      timeout: 10s
      retries: 20
      start_period: 10s

  # Crea colecciones e índices de forma idempotente y termina.
  mongo-init:
    image: mongo:${MONGO_VERSION:-8.0}
    depends_on:
      mongo:
        condition: service_healthy
    environment:
      MONGO_DB: ${MONGO_DB:-orders}
    volumes:
      - ./infra/mongo/init-indexes.js:/scripts/init-indexes.js:ro
    entrypoint: ["mongosh", "mongodb://mongo:27017/?replicaSet=rs0", "--quiet", "/scripts/init-indexes.js"]
    restart: "no"

  products-api:
    build: ./products-api
    ports:
      - "${PRODUCTS_API_PORT:-8081}:8080"
    environment:
      PORT: "8080"
      REQUEST_TIMEOUT: 5s
      SHUTDOWN_TIMEOUT: 10s
      FAULT_INJECTION_ENABLED: ${FAULT_INJECTION_ENABLED:-true}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    healthcheck:
      test: ["CMD", "/products-api", "-healthcheck"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s
    stop_grace_period: 15s

  clients-api:
    build: ./clients-api
    ports:
      - "${CLIENTS_API_PORT:-8082}:8080"
    environment:
      PORT: "8080"
      REQUEST_TIMEOUT: 5s
      SHUTDOWN_TIMEOUT: 10s
      FAULT_INJECTION_ENABLED: ${FAULT_INJECTION_ENABLED:-true}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    healthcheck:
      test: ["CMD", "node", "dist/healthcheck.js"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 10s
    stop_grace_period: 15s

  # ---------------------------------------------------------------------------
  # Herramientas opcionales (perfil "tools"). No se levantan por defecto.
  # ---------------------------------------------------------------------------
  kafka-ui:
    image: kafbat/kafka-ui:${KAFKA_UI_VERSION:-v1.2.0}
    profiles: ["tools"]
    depends_on:
      kafka:
        condition: service_healthy
    ports:
      - "${KAFKA_UI_PORT:-8080}:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:19092