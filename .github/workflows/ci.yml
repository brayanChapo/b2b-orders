name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contracts:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: contracts
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: contracts/package-lock.json
      - run: npm ci
      - run: npm run validate

  products-api:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: products-api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: products-api/go.mod
      - run: go vet ./...
      - run: go test -race ./...

  clients-api:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: clients-api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: clients-api/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  order-processor:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: order-processor
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven
      # verify incluye los tests de integración: el runner trae Docker para Testcontainers
      - run: chmod +x mvnw && ./mvnw -B verify

  images:
    runs-on: ubuntu-latest
    needs: [products-api, clients-api, order-processor]
    steps:
      - uses: actions/checkout@v4
      - run: docker compose build
